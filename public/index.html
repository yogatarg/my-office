<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MY Office</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Manrope:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root { --ink: #141414; --paper: #f4f2ec; --yellow: #f5cb18; --muted: #5d5f63; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #b8b7b8; color: var(--ink); font-family: 'Manrope', sans-serif; }
    #stage { position: fixed; inset: 0; }
    #stage canvas { display: block; }
    .labels { position: absolute; inset: 0; pointer-events: none; }

    header {
      position: fixed; top: 16px; left: 16px; z-index: 2;
      display: flex; align-items: center; gap: 12px;
      padding: 10px 14px; border-radius: 14px;
      background: rgba(244, 242, 236, .86); backdrop-filter: blur(10px);
      box-shadow: 0 3px 0 rgba(0,0,0,.12);
    }
    .stud { width: 22px; height: 22px; border-radius: 50%; background: radial-gradient(circle at 50% 42%, #ffe45c 0 30%, var(--yellow) 31% 60%, #d9b20e 61% 68%, var(--yellow) 69%); box-shadow: 0 3px 0 #b8940a; }
    h1 { margin: 0; font: 800 15px 'Unbounded', sans-serif; letter-spacing: -.02em; }
    #status { font-size: 12px; color: var(--muted); }
    #status[data-on="true"] { color: #1d7a43; }
    header a { font-size: 12px; font-weight: 700; color: var(--ink); text-decoration: none; border-bottom: 2px solid var(--yellow); }
    #project { font: 700 12px 'Manrope', sans-serif; background: #2b313c; color: #f4f2ec; border-radius: 8px; padding: 4px 9px; }
    #quality { font: 700 12px 'Manrope', sans-serif; color: var(--ink); background: #fff; border: 1px solid rgba(0,0,0,.15); border-radius: 8px; padding: 4px 9px; cursor: pointer; }
    #quality, #notify, #summary-button { font: 700 12px 'Manrope', sans-serif; color: var(--ink); background: #fff; border: 1px solid rgba(0,0,0,.15); border-radius: 8px; padding: 4px 9px; cursor: pointer; }
    #quality:hover, #notify:hover, #summary-button:hover { background: #f4f2ec; }

    /* Ringkasan kerja */
    #summary { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 5; width: min(760px, calc(100vw - 32px)); max-height: calc(100vh - 48px); overflow: auto; padding: 18px 20px; font-size: 13px; }
    .summary-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .summary-head h2 { margin: 0; font: 800 16px 'Unbounded', sans-serif; }
    .summary-nav { display: flex; align-items: center; gap: 8px; font-weight: 700; }
    .summary-nav button { width: 28px; height: 28px; border-radius: 8px; border: 1px solid rgba(0,0,0,.15); background: #fff; cursor: pointer; font-size: 16px; }
    .summary-nav button:disabled { opacity: .35; cursor: default; }
    .summary-close { margin-left: auto; border: 0; background: transparent; font-size: 22px; cursor: pointer; color: var(--muted); }
    #summary .muted { color: var(--muted); margin: 6px 0; }
    #summary h3 { margin: 16px 0 6px; font: 600 10px 'Unbounded', sans-serif; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
    .summary-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(105px, 1fr)); gap: 8px; margin-top: 8px; }
    .tile { background: #fff; border-radius: 10px; padding: 10px 12px; border: 1px solid rgba(0,0,0,.08); }
    .tile strong { display: block; font: 800 22px 'Unbounded', sans-serif; }
    .tile span { color: var(--muted); font-size: 12px; }
    .hours { display: grid; grid-template-columns: repeat(24, 1fr); gap: 2px; height: 130px; align-items: end; padding: 16px 0 0; margin-bottom: 26px; border-bottom: 1px solid rgba(0,0,0,.18); position: relative; }
    .hour { position: relative; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; cursor: default; }
    .hour .bar { width: 100%; max-width: 18px; min-height: 0; background: #2f6db5; border-radius: 4px 4px 0 0; }
    .hour:hover .bar { background: #1d4e8f; }
    .hour em { position: absolute; top: -16px; font-style: normal; font-weight: 700; font-size: 11px; color: var(--ink); }
    .hour small { position: absolute; bottom: -18px; color: var(--muted); font-size: 10.5px; }
    .hour:hover::after { content: attr(data-tip); position: absolute; bottom: calc(100% + 4px); white-space: nowrap; background: var(--ink); color: #fff; font-size: 11px; padding: 3px 7px; border-radius: 6px; z-index: 1; }
    .summary-table { width: 100%; border-collapse: collapse; margin-top: 22px; font-size: 12.5px; }
    #summary h3 + .summary-table { margin-top: 0; }
    .summary-table th { text-align: left; color: var(--muted); font-weight: 700; padding: 5px 6px; border-bottom: 1px solid rgba(0,0,0,.15); }
    .summary-table td { padding: 5px 6px; border-bottom: 1px solid rgba(0,0,0,.06); font-variant-numeric: tabular-nums; }
    .summary-table .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }
    .summary-lists { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .summary-list { margin: 0; padding: 0; list-style: none; }
    .summary-list li { display: flex; justify-content: space-between; gap: 8px; padding: 3px 0; border-bottom: 1px solid rgba(0,0,0,.06); }
    .summary-list span { font-family: ui-monospace, Consolas, monospace; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    @media (max-width: 600px) { .summary-lists { grid-template-columns: 1fr; } .summary-table th:nth-child(n+4), .summary-table td:nth-child(n+4) { display: none; } }
    button:focus-visible { outline: 2px solid var(--yellow); outline-offset: 2px; }

    .panel { background: rgba(244, 242, 236, .92); backdrop-filter: blur(10px); box-shadow: 0 3px 0 rgba(0,0,0,.12); border-radius: 14px; }

    /* Panel detail karyawan */
    #detail { position: fixed; left: 16px; top: 80px; z-index: 3; width: 310px; max-height: calc(100vh - 160px); overflow: auto; padding: 14px; font-size: 12.5px; }
    .detail-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .detail-role { font: 800 12px 'Unbounded', sans-serif; text-transform: uppercase; color: #fff; background: var(--accent); padding: 4px 9px; border-radius: 7px; }
    .detail-division { color: var(--muted); font-weight: 700; }
    .detail-close { margin-left: auto; border: 0; background: transparent; font-size: 20px; line-height: 1; cursor: pointer; color: var(--muted); }
    .detail-facts { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; margin: 0 0 8px; }
    .detail-facts dt { color: var(--muted); }
    .detail-facts dd { margin: 0; font-weight: 700; }
    #detail h3 { margin: 10px 0 4px; font: 600 10px 'Unbounded', sans-serif; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
    .detail-files { display: flex; flex-wrap: wrap; gap: 4px; margin: 0; padding: 0; list-style: none; }
    .detail-files li { background: #fff; border: 1px solid rgba(0,0,0,.1); border-radius: 6px; padding: 1px 6px; font-family: ui-monospace, Consolas, monospace; font-size: 11px; }
    .detail-history { margin: 0; padding: 0; list-style: none; }
    .detail-history li { display: flex; gap: 8px; padding: 3px 0 3px 8px; border-left: 3px solid var(--accent); margin-bottom: 2px; }
    .detail-history time { color: var(--muted); flex: none; font-variant-numeric: tabular-nums; }
    .detail-history .muted { color: var(--muted); border: 0; }
    .detail-follow { margin-top: 10px; width: 100%; font: 700 12px 'Manrope', sans-serif; padding: 7px; border-radius: 8px; border: 0; background: var(--ink); color: #fff; cursor: pointer; }

    /* Navigasi zona */
    #zones { position: fixed; left: 16px; bottom: 16px; z-index: 2; display: flex; gap: 6px; max-width: calc(100vw - 390px); overflow-x: auto; padding: 8px; }
    #zones { scrollbar-width: thin; scrollbar-color: rgba(0,0,0,.25) transparent; }
    #zones button { flex: none; font: 700 11.5px 'Manrope', sans-serif; border: 1px solid rgba(0,0,0,.12); background: #fff; border-radius: 8px; padding: 5px 9px; cursor: pointer; }
    #zones button:hover { background: var(--yellow); }

    /* Minimap */
    #minimap { position: fixed; right: 16px; top: 16px; z-index: 2; padding: 8px; }
    #minimap canvas { display: block; border-radius: 8px; cursor: pointer; }

    aside {
      position: fixed; right: 16px; bottom: 16px; z-index: 2; width: min(340px, calc(100vw - 32px));
      padding: 12px 14px; border-radius: 14px;
      background: rgba(244, 242, 236, .9); backdrop-filter: blur(10px); box-shadow: 0 3px 0 rgba(0,0,0,.12);
    }
    aside h2 { margin: 0 0 6px; font: 600 11px 'Unbounded', sans-serif; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
    #feed { list-style: none; margin: 0; padding: 0; font-size: 12.5px; }
    #feed li { display: flex; gap: 8px; padding: 4px 0 4px 9px; border-left: 3px solid var(--accent); margin-bottom: 3px; }
    #feed li:first-child { animation: in .3s ease-out; }
    #feed time { color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }
    #feed span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #feed:empty::after { content: 'Belum ada aktivitas. Jalankan Claude Code di folder playground.'; color: var(--muted); }

    /* Label di atas kepala karakter */
    .tag { pointer-events: auto; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; transform: translateY(-6px); }
    .tag .role { font: 800 10px 'Unbounded', sans-serif; letter-spacing: .04em; text-transform: uppercase; color: #fff; background: var(--accent); padding: 3px 7px; border-radius: 6px; box-shadow: 0 2px 0 rgba(0,0,0,.25); }
    .tag .state { font-weight: 700; background: rgba(244,242,236,.92); padding: 1px 6px; border-radius: 5px; }
    .tag .detail { max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); background: rgba(244,242,236,.8); padding: 0 5px; border-radius: 4px; }
    .tag .detail:empty { display: none; }
    .tag[data-status="asleep"] .state { opacity: .7; }
    .tag .bang { display: none; }
    /* Karyawan yang siaga cukup ditandai nama perannya, supaya blok meja yang ramai tetap terbaca. */
    .tag[data-status="asleep"]:not(.talking) .state,
    .tag[data-status="asleep"]:not(.talking) .detail { display: none; }
    .tag[data-status="asleep"] .role { opacity: .75; font-size: 9px; padding: 2px 6px; }
    .tag.alert .bang { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--yellow); font: 800 15px 'Unbounded', sans-serif; box-shadow: 0 3px 0 #b8940a; animation: bounce .9s ease-in-out infinite; }
    .tag .bubble {
      position: relative; max-width: 190px; margin-bottom: 6px; padding: 5px 9px; border-radius: 10px;
      background: #fff; color: var(--ink); font-size: 11.5px; font-weight: 600; line-height: 1.3; text-align: center;
      box-shadow: 0 2px 0 rgba(0,0,0,.18); border: 2px solid var(--accent);
      display: none; animation: pop .25s ease-out;
    }
    .tag.talking .bubble { display: block; }
    .tag .bubble i { font-style: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .tag .bubble::after { content: ''; position: absolute; left: 50%; bottom: -7px; width: 10px; height: 10px; background: #fff; border: 2px solid var(--accent); border-top: 0; border-left: 0; transform: translateX(-50%) rotate(45deg); }
    .tag.selected .role { outline: 3px solid var(--yellow); outline-offset: 1px; }
    .zone { font: 600 10px 'Unbounded', sans-serif; text-transform: uppercase; letter-spacing: .08em; color: rgba(20,20,20,.55); pointer-events: none; }

    @keyframes bounce { 50% { transform: translateY(-6px); } }
    @keyframes float { 50% { transform: translateY(-4px); opacity: .6; } }
    @keyframes in { from { opacity: 0; transform: translateX(8px); } }
    @keyframes pop { from { opacity: 0; transform: translateY(6px) scale(.9); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    @media (max-width: 900px) {
      #minimap { display: none; }
      #zones { max-width: calc(100vw - 32px); bottom: auto; top: 76px; }
    }
    @media (max-width: 600px) {
      header { top: 12px; left: 12px; right: 12px; flex-wrap: wrap; }
      aside { right: 12px; left: 12px; bottom: 12px; width: auto; }
      #detail { left: 12px; right: 12px; top: auto; bottom: 12px; width: auto; max-height: 55vh; }
      body.detail-open aside { display: none; }
      #feed li:nth-child(n+4) { display: none; }
    }
  </style>
  <script type="importmap">
    { "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/examples/jsm/" } }
  </script>
</head>
<body>
  <div id="stage"></div>
  <header>
    <div class="stud" aria-hidden="true"></div>
    <h1>MY Office</h1>
    <span id="status">menghubungkan…</span>
    <span id="project" hidden></span>
    <button id="quality" type="button" title="Ganti kualitas grafis">Kualitas: Tinggi</button>
    <button id="summary-button" type="button" aria-expanded="false" aria-controls="summary">📊 Ringkasan</button>
    <button id="notify" type="button" title="Bunyi dan notifikasi saat CEO selesai atau butuh perhatianmu" aria-pressed="false">🔕 Notifikasi: Mati</button>
    <a href="/log.html" target="_blank">Log mentah</a>
  </header>
  <section id="detail" class="panel" hidden aria-live="polite"></section>
  <section id="summary" class="panel" hidden role="dialog" aria-label="Ringkasan kerja"></section>
  <nav id="zones" class="panel" aria-label="Pindah ke zona"></nav>
  <div id="minimap" class="panel" title="Klik untuk memindahkan kamera"><canvas aria-label="Minimap kantor"></canvas></div>
  <aside>
    <h2>Aktivitas</h2>
    <ul id="feed"></ul>
  </aside>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
